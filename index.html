<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>英検3級 爆速合格クイズ - File 1 (1-500語) 🐾</title>
    <style>
        :root {
            --primary-orange: #FF8C00;
            --light-orange: #FFF5EE;
            --dark-orange: #E67E22;
            --correct-green: #2ECC71;
            --incorrect-red: #E74C3C;
            --text-dark: #2C3E50;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--light-orange);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(230, 126, 34, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 3px solid var(--primary-orange);
            position: relative;
        }
        h1 {
            color: var(--primary-orange);
            font-size: 24px;
            margin-bottom: 30px;
        }
        .level-select {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .level-btn {
            background-color: #fff;
            border: 2px solid var(--primary-orange);
            color: var(--primary-orange);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .level-btn.active {
            background-color: var(--primary-orange);
            color: #fff;
        }
        .input-group {
            margin-bottom: 30px;
        }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .question-input {
            width: 80px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid var(--primary-orange);
            border-radius: 5px;
            text-align: center;
        }
        .start-btn {
            background-color: var(--dark-orange);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .start-btn:hover {
            background-color: var(--primary-orange);
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .home-btn {
            background-color: #7F8C8D;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .question-text {
            font-size: 28px;
            font-weight: bold;
            margin: 40px 0;
            color: var(--text-dark);
        }
        .options-grid {
            display: grid;
            grid-template-columns: 100%;
            gap: 15px;
            margin-bottom: 30px;
        }
        .option-btn {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .option-btn.correct {
            background-color: var(--correct-green) !important;
        }
        .option-btn.incorrect {
            background-color: var(--incorrect-red) !important;
        }
        .hidden {
            display: none !important;
        }
        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-orange);
            margin: 30px 0;
        }
        .cat-deco {
            font-size: 24px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ホーム画面 -->
    <div id="home-screen">
        <div class="cat-deco">🐾 🐱 🐾</div>
        <h1>英検3級 単語テスト (File 1 / 1-500語)</h1>
        <p>挑戦するレベルを選んでニャ！</p>
        <div class="level-select">
            <button class="level-btn active" onclick="selectLevel('all')">全レベル</button>
            <button class="level-btn" onclick="selectLevel('elementary')">初級</button>
            <button class="level-btn" onclick="selectLevel('intermediate')">中級</button>
            <button class="level-btn" onclick="selectLevel('advanced')">上級</button>
        </div>
        <div class="input-group">
            <label for="quiz-count">何問に挑戦するニャ？</label>
            <input type="number" id="quiz-count" class="question-input" value="10" min="1" max="500">
        </div>
        <button class="start-btn" onclick="startQuiz()">クイズを始める 🐾</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="hidden">
        <div class="quiz-header">
            <span id="progress-text">1 / 10問目</span>
            <button class="home-btn" onclick="confirmGoHome()">ホームに戻る</button>
        </div>
        <p style="color: #7F8C8D; margin: 0;">この日本語に合う英語を選んでニャ！</p>
        <div id="question-box" class="question-text">日本語の意味</div>
        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)">選択肢1</button>
            <button class="option-btn" onclick="checkAnswer(1)">選択肢2</button>
            <button class="option-btn" onclick="checkAnswer(2)">選択肢3</button>
            <button class="option-btn" onclick="checkAnswer(3)">選択肢4</button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden">
        <div class="cat-deco">🎉 🐱 🎉</div>
        <h1>テスト結果発表！</h1>
        <div id="score-text" class="result-score">0 / 10</div>
        <p id="comment-text">お疲れ様だニャ！</p>
        <button class="start-btn" onclick="backToHome()">もう一度あそぶ</button>
    </div>
</div>
